name: Release to GitHub and Modrinth

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: pour-and-seap-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Validate assets
        run: python3 scripts/validate_assets.py

      - name: Build JAR
        run: ./gradlew --no-daemon clean build

      - name: Verify release tag and JAR
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^mod_version=//p' gradle.properties)"
          test -n "$VERSION"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
          JAR="build/libs/pour_and_seap-${VERSION}.jar"
          test -f "$JAR"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release if absent
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          JAR: ${{ steps.meta.outputs.jar }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" "$JAR" \
              --target "$GITHUB_SHA" \
              --title "Pour & Seap $VERSION — Fabric 1.20.1" \
              --notes-file CHANGELOG.md
          fi

      - name: Check Modrinth setup and versions
        id: modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT: ${{ vars.MODRINTH_PROJECT }}
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$MODRINTH_TOKEN" || -z "$MODRINTH_PROJECT" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Missing MODRINTH_TOKEN secret or MODRINTH_PROJECT variable." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          RESPONSE="$(mktemp)"
          CODE="$(curl -sS -o "$RESPONSE" -w '%{http_code}' \
            -H "Authorization: $MODRINTH_TOKEN" \
            "https://api.modrinth.com/v2/project/$MODRINTH_PROJECT")"
          if [[ "$CODE" != "200" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Modrinth project unavailable ($CODE)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ID="$(jq -r '.id' "$RESPONSE")"
          if curl -fsSL -H "Authorization: $MODRINTH_TOKEN" \
            "https://api.modrinth.com/v2/project/$ID/version?include_changelog=false" \
            | jq -e --arg v "$VERSION" '.[] | select(.version_number == $v)' >/dev/null; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Modrinth version $VERSION already exists; skipped." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Publish on Modrinth
        if: steps.modrinth.outputs.ready == 'true'
        uses: Kir-Antipov/mc-publish@v3.3.0
        with:
          modrinth-id: ${{ steps.modrinth.outputs.id }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: ${{ steps.meta.outputs.jar }}
          name: Pour & Seap ${{ steps.meta.outputs.version }}
          version: ${{ steps.meta.outputs.version }}
          version-type: release
          changelog-file: CHANGELOG.md
          loaders: fabric
          game-versions: 1.20.1
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}
          java: 17
          fail-mode: fail
